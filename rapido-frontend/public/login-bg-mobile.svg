  <circle cx="302" cy="638" r="26" fill="#0F172A"/>
  <circle cx="302" cy="638" r="16" fill="#334155"/>
  <circle cx="302" cy="638" r="7"  fill="#64748B"/>
  <line x1="302" y1="622" x2="302" y2="654" stroke="#94A3B8" stroke-width="2.5" opacity="0.8"/>
  <line x1="286" y1="638" x2="318" y2="638" stroke="#94A3B8" stroke-width="2.5" opacity="0.8"/>
  <line x1="291" y1="627" x2="313" y2="649" stroke="#94A3B8" stroke-width="1.5" opacity="0.6"/>
