  <rect x="360" y="578" width="18" height="9" fill="#EF4444" rx="2" opacity="0.8"/>

  <!-- Tail lights -->
  <rect x="56" y="560" width="18" height="14" fill="#FCA5A5" rx="3" opacity="0.8"/>
  <rect x="56" y="578" width="18" height="9" fill="#EF4444" rx="2" opacity="0.9"/>

