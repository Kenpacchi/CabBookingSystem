  <rect x="178" y="594" width="20" height="7" fill="#D97706" rx="3" opacity="0.9"/>

  <!-- Roof TAXI light -->
  <rect x="195" y="496" width="46" height="14" fill="#FEF9C3" rx="4" filter="url(#mglow)"/>
  <text x="218" y="507" text-anchor="middle" font-size="7" font-weight="bold" fill="#D97706" font-family="Arial">TAXI</text>

  <!-- Front bumper -->
  <rect x="362" y="580" width="14" height="40" fill="#D97706" rx="3" opacity="0.9"/>

  <!-- Rear bumper -->
  <rect x="58" y="580" width="14" height="40" fill="#D97706" rx="3" opacity="0.9"/>

  <!-- Headlights -->
