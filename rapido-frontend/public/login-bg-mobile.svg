  <!-- Windshield front -->
  <path d="M290 512 Q313 515 322 551 L282 551 Z" fill="#BFDBFE" opacity="0.65"/>
  <!-- Windshield rear -->
  <path d="M135 512 Q128 516 102 551 L138 551 Z" fill="#BFDBFE" opacity="0.6"/>

  <!-- Side windows -->
  <rect x="156" y="513" width="65" height="36" fill="#BFDBFE" opacity="0.65" rx="4"/>
  <rect x="232" y="513" width="45" height="36" fill="#BFDBFE" opacity="0.65" rx="4"/>
  <rect x="154" y="511" width="69" height="40" fill="none" stroke="#D97706" stroke-width="2" rx="4"/>
  <rect x="230" y="511" width="49" height="40" fill="none" stroke="#D97706" stroke-width="2" rx="4"/>

  <!-- Door lines -->
