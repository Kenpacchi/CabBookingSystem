  <line x1="152" y1="553" x2="152" y2="635" stroke="#D97706" stroke-width="1.5" opacity="0.5"/>
  <line x1="310" y1="553" x2="310" y2="635" stroke="#D97706" stroke-width="1.5" opacity="0.5"/>

