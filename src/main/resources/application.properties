# Application name
spring.application.name=CABkaro

# Server port
server.port=8080

# ===============================
# = POSTGRESQL DB CONFIGURATION =
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=Ajay@2003
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# = JWT CONFIGURATION           =
# ===============================
# Secret must be a Base64-encoded string of at least 256 bits (32 bytes)
jwt.secret=dGhpcyFpc0FTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9u
# Token expiry: 24 hours in milliseconds
jwt.expiration=86400000

# ===============================
# = GOOGLE MAPS API KEY         =
# ===============================
# Leave blank to use Haversine fallback (free, no API key needed)
# Get a free key at: https://console.cloud.google.com/
# Enable: Distance Matrix API
# Used by DistanceService to calculate accurate route distances/durations.
# Without this key, the app uses the Haversine formula (straight-line distance).
google.maps.api.key=

# ===============================
# = GOOGLE OAUTH (Sign-In)      =
# ===============================
# Used to verify Google ID tokens on the backend (optional extra server-side check).
# Get your Client ID from: https://console.cloud.google.com/
#   APIs & Services → Credentials → OAuth 2.0 Client IDs
# Must match the VITE_GOOGLE_CLIENT_ID configured in rapido-frontend/.env
